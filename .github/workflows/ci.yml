name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep this job name: it's the required status check on main.
  # Still to come in phase 1 (#7): build-app.sh, package-release.sh, the full version check, cask lint.
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # build number = commit count (phase 1)
      - run: swift --version
      - name: Repo checks (privacy, syntax, version)
        run: ./scripts/ci-checks.sh
      - uses: astral-sh/setup-uv@v6
      - name: Core tests
        working-directory: core
        run: uv sync --locked && uv run pytest -q
      - name: Build (debug)
        run: swift build
      - name: Self-test
        run: swift run zoe-selftest
      - name: Smoke test (app ↔ core, echo brain; CI has no Claude login)
        env:
          ZOE_BRAIN: echo
        run: swift run Zoe --smoke "hello from CI"
