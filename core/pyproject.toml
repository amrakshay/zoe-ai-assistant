[project]
name = "zoe-core"
version = "0.0.0"
description = "Zoe's text-only core: talks to the app over JSON lines on stdin/stdout"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
zoe-core = "zoe_core.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zoe_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
