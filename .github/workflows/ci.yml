name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep this job name: it's the required status check on main.
  # Phase 1 adds: swift build, self-test (Swift app + Python core gate policy tests), build-app.sh,
  # package-release.sh, the full version check and the Homebrew cask lint (see PLAN.md §8, phase 1).
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # build number = commit count (phase 1)
      - run: swift --version
      - name: Repo checks (privacy, syntax, version)
        run: ./scripts/ci-checks.sh
